# Works with `docker compose up -d --build` and as a Portainer Git stack.
# Settings below can be overridden with environment variables (Portainer: "Environment variables").
services:
  # The service keeps its original name: renaming it would leave existing installs' container
  # running beside the new one (same port), and the redeploy would fail.
  iptv-manager:
    build: .
    image: simple-iptv-manager:latest
    # Built from this repo, never pulled from a registry: keeps "re-pull image" in
    # Portainer (docker compose pull) from looking for it on Docker Hub.
    pull_policy: build
    container_name: simple-iptv-manager
    restart: unless-stopped
    # Docker keeps container logs without a size limit unless told otherwise: at most 3 files of
    # 10 MB here, the oldest dropped first.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - "${IPTV_PORT:-8080}:8080"
    volumes:
      # A named volume is created with the right ownership for the container's
      # non-root user. To use a host folder instead, chown it to 1000:1000 first.
      - iptv-data:/data
    environment:
      # Only affects log timestamps; guide times are stored with their UTC offsets.
      TZ: ${TZ:-UTC}
      # Optional: if set, becomes the admin password on every start (also password recovery).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    # Optional, for light streams with Intel Quick Sync: pass the GPU in, and let the container
    # user open it (the number is the host's render group: getent group render | cut -d: -f3).
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "993"

volumes:
  iptv-data:
